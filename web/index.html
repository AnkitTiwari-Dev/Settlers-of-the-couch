<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button id = 0>
        button
    </button>
    <p id = 1>

    </p>
    <script>
        const b = document.getElementById(0)
        const p = document.getElementById(1)
        b.addEventListener("click",async() => {
            b.disabled = true
            try{
                const res = await fetch("/create",{method: "POST"})
                const data = await res.json()
                if(!res.ok){
                    p.textContent("Server unreachable")
                    b.disabled = false
                }
                else{
                    sessionStorage.setItem("hostToken",data.token)
                    sessionStorage.setItem("hostCode",data.code)
                    location.href = "/host.html"
                }
            }
            catch{
                p.textContent("Server unreachable")
                b.disabled = false
            }
        })
    </script>
</body>
</html>
