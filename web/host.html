<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 id = "roomCode"></h1>
    <ul id = "plist"></ul>
    <p id = "error"></p>
    <script>
        const hostCode = sessionStorage.getItem("hostCode")
        const hostToken = sessionStorage.getItem("hostToken")
        const plist = document.getElementById("plist")
        const errorEl = document.getElementById("error")
        const roomCodeEl = document.getElementById("roomCode")
        if(!hostCode || !hostToken){
            location.href = "/"
        }
        else{
            roomCodeEl.textContent = `Room Code: ${hostCode}`
            const protocol = location.protocol === "https:" ? "wss:" : "ws:";
            const ws = new WebSocket(`${protocol}//${location.host}/ws/${hostCode}`);
            ws.onopen = (event) => {
                ws.send(JSON.stringify({role:"tv", token: hostToken}))
            }
            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data)
                if (msg.type === "view"){
                    plist.textContent = ""
                    const players = msg.view.players || []
                    for (const player of players){
                        const li = document.createElement("li")
                        li.textContent = typeof player === "string" ? player : player.name
                        plist.appendChild(li)
                    }
                }
                else if(msg.type === "error"){
                    errorEl.textContent = "Error"
                }
            }
            ws.onclose = (event) => {
                errorEl.textContent = "Disconnected"
            }
        }
        
    </script>
</body>
</html>
